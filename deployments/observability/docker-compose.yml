services:
  prometheus:
    image: prom/prometheus:latest
    container_name: mindova-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mindova_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    # host.docker.internal resolves automatically on Docker Desktop
    # (macOS/Windows). This extra_hosts entry makes the same config work
    # unmodified on Linux too (Docker 20.10+), where it doesn't resolve
    # by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: mindova-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - mindova_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  mindova_prometheus_data:
  mindova_grafana_data: