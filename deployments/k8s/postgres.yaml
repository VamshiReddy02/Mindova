apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: mindova
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mindova
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName is explicit rather than left to implicit
  # defaulting — "hostpath" is what `kubectl get storageclass` showed
  # as this cluster's (default) class. Being explicit means this
  # manifest keeps working correctly even if the cluster's default
  # StorageClass ever changes to something else.
  storageClassName: hostpath
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mindova
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mindova
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: mindova
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: mindova
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          # Same check used as the Docker Compose healthcheck — proven
          # to correctly signal real readiness (not just "the process
          # started"), reused here as both probes.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "mindova"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "mindova"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            # Modest defaults for a local single-node dev cluster —
            # tune before this represents anything closer to production
            # load.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mindova
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mindova
spec:
  # Headless (clusterIP: None) is the standard pairing for a
  # StatefulSet's governing service — it's what gives each Pod a
  # stable per-Pod DNS identity (postgres-0.postgres.mindova.svc...),
  # which matters if this ever scales beyond 1 replica. It still
  # resolves at the plain service level too, which is the address
  # other services actually use:
  #   postgres.mindova.svc.cluster.local:5432
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres