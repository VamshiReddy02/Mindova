apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: mindova
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mindova
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: document-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: mindova
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindova-secrets
                  key: DB_PASSWORD
          command:
            - sh
            - -c
            - |
              until psql -h postgres -U postgres -d mindova -c "SELECT 1 FROM documents LIMIT 1" > /dev/null 2>&1; do
                echo "waiting for database schema (documents table) to exist..."
                sleep 3
              done
              echo "schema found, proceeding."
      containers:
        - name: document-service
          image: mindova/document-service:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APP_NAME
              value: document-service
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: mindova
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mindova-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindova-secrets
                  key: DB_PASSWORD
            - name: EMBEDDING_SERVICE_URL
              value: http://ai-service:8001
            - name: LLM_SERVICE_URL
              value: http://ai-service:8001
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: mindova
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mindova
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: document-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http