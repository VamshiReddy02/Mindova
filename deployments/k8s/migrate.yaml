apiVersion: batch/v1
kind: Job
metadata:
  name: mindova-migrate
  namespace: mindova
  labels:
    app.kubernetes.io/name: mindova-migrate
    app.kubernetes.io/component: database-migrations
    app.kubernetes.io/part-of: mindova
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mindova-migrate
        app.kubernetes.io/component: database-migrations
        app.kubernetes.io/part-of: mindova
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U postgres -d mindova; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindova-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -e
              for f in $(ls /migrations/*.sql | sort); do
                echo "Applying $f..."
                psql -h postgres -U postgres -d mindova -f "$f"
              done
              echo "All migrations applied successfully."
      volumes:
        - name: migrations
          configMap:
            name: mindova-migrations