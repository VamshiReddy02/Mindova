apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: mindova
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: mindova
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/component: ai
        app.kubernetes.io/part-of: mindova
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ai-service
          image: mindova/ai-service:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: LLM_PROVIDER
              value: openrouter
            - name: OPENROUTER_MODEL
              value: openrouter/free
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mindova-secrets
                  key: OPENROUTER_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: mindova
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: mindova
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-service
  ports:
    - port: 8001
      targetPort: 8001
      name: http